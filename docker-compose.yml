services:
  model-api:
    build: .
    container_name: lead-scanner-model-api
    restart: always

    environment:
      VLLM_HOST: http://vllm:8000
      DEFAULT_MODEL: Qwen/Qwen3-14B-AWQ
      VLLM_TIMEOUT: 90

    ports:
      - "8000:8000"

    depends_on:
      vllm:
        condition: service_started

    networks:
      - lead-scanner-net

  vllm:
    image: vllm/vllm-openai:v0.19.0
    container_name: lead-scanner-vllm
    restart: unless-stopped

    ipc: host
    gpus: all

    volumes:
      - huggingface-cache:/root/.cache/huggingface

    command:
      - --model
      - Qwen/Qwen3-14B-AWQ
      - --served-model-name
      - Qwen/Qwen3-14B-AWQ
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.85"
      - --max-num-seqs
      - "4"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/v1/models >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

    networks:
      - lead-scanner-net

volumes:
  huggingface-cache:

networks:
  lead-scanner-net:
    external: true
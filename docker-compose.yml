services:
  model-api:
    build: .
    container_name: lead-scanner-model-api
    restart: always

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_TIMEOUT: 90

    ports:
      - "8000:8000"

    depends_on:
      - ollama

    networks:
      - lead-scanner-net

  ollama:
    image: ollama/ollama:latest
    container_name: lead-scanner-ollama
    restart: always

    volumes:
      - ollama-data:/root/.ollama

    ports:
      - "11434:11434"

    networks:
      - lead-scanner-net

#    gpus: all

  ollama-pull:
    image: ollama/ollama:latest
    container_name: lead-scanner-ollama-pull
    restart: "no"

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: qwen2.5:7b

    volumes:
      - ollama-data:/root/.ollama

    entrypoint: >
      sh -c "
      until ollama list >/dev/null 2>&1; do
        echo 'Waiting for Ollama...';
        sleep 2;
      done;
      ollama pull $$MODEL;
      echo 'Model downloaded';
      "

    networks:
      - lead-scanner-net

  grafana:
    image: grafana/grafana:latest
    container_name: lead-scanner-grafana
    restart: always

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

    networks:
      - lead-scanner-net

  prometheus:
    image: prom/prometheus
    container_name: lead-scanner-prometheus
    restart: always

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - lead-scanner-net

  loki:
    image: grafana/loki:latest
    container_name: lead-scanner-loki
    restart: always

    ports:
      - "3100:3100"

    volumes:
      - loki-data:/loki

    networks:
      - lead-scanner-net

  promtail:
    image: grafana/promtail:latest
    container_name: lead-scanner-promtail
    restart: always

    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail.yml:/etc/promtail/config.yml
      - promtail-data:/tmp

    command:
      - -config.file=/etc/promtail/config.yml

    depends_on:
      - loki

    networks:
      - lead-scanner-net

volumes:
  ollama-data:
  grafana-data:
  prometheus-data:
  loki-data:
  promtail-data:

networks:
  lead-scanner-net:
    external: true
services:
  vllm:
    image: vllm/vllm-openai:v0.19.0
    container_name: lead-scanner-vllm
    restart: unless-stopped

    ipc: host
    gpus: all

    env_file:
      - .env

    volumes:
      - huggingface-cache:/root/.cache/huggingface

    ports:
      - "8000:8000"

    command:
      - --model
      - Qwen/Qwen3-14B-AWQ
      - --served-model-name
      - Qwen/Qwen3-14B-AWQ
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.85"
      - --max-num-seqs
      - "4"
      - --reasoning-parser
      - qwen3
      - --api-key
      - ${VLLM_API_KEY}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H \"Authorization: Bearer ${VLLM_API_KEY}\" http://localhost:8000/v1/models >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

    networks:
      - lead-scanner-net

volumes:
  huggingface-cache:

networks:
  lead-scanner-net:
    external: true
services:
  model-api:
    build: .
    container_name: lead-scanner-model-api
    restart: always

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:7b
      OLLAMA_TIMEOUT: 90

    ports:
      - "8000:8000"

    depends_on:
      - ollama

    networks:
      - lead-scanner-net

  ollama:
    image: ollama/ollama:latest
    container_name: lead-scanner-ollama
    restart: always

    volumes:
      - ollama-data:/root/.ollama

    ports:
      - "11434:11434"

    networks:
      - lead-scanner-net

    gpus: all

  ollama-pull:
    image: ollama/ollama:latest
    container_name: lead-scanner-ollama-pull
    restart: "no"

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: qwen2.5:7b

    volumes:
      - ollama-data:/root/.ollama

    entrypoint: >
      sh -c "
      until ollama list >/dev/null 2>&1; do
        echo 'Waiting for Ollama...';
        sleep 2;
      done;
      ollama pull $$MODEL;
      echo 'Model downloaded';
      "

    networks:
      - lead-scanner-net

volumes:
  ollama-data:

networks:
  lead-scanner-net:
    name: lead-scanner-net
    driver: bridge